  <circle cx="34" cy="34" r="2" fill="#1A73E8"/>
  <!-- Connector port lines on top -->
  <line x1="16" y1="18" x2="26" y2="18" stroke="#1A73E8" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="23" x2="22" y2="23" stroke="#1A73E8" stroke-width="2" stroke-linecap="round"/>
</svg>
